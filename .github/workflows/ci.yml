name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (testes + cobertura)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: plataforma_energia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plataforma_energia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: plataforma_energia
      DB_USER: postgres
      DB_PASSWORD: postgres_dev
      JWT_SECRET: segredo-somente-para-o-ci-1234567890

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Aplicar a migração do banco
        run: psql -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres_dev
          PGDATABASE: plataforma_energia

      - name: Testes unitários e de integração, com cobertura mínima de 80% (RNF05)
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Docker Compose (configuração válida)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
